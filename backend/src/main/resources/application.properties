server.port=8080

# Directorio donde Spring Boot lee los JSON de simulación y persiste nuevos resultados.
# Ruta relativa al directorio de trabajo del proceso Java (normalmente backend/).
# Cambiar a ruta absoluta si se ejecuta desde otro directorio.
simulations.data-dir=../matlab/output

# GeoTIFF local requerido para simular cobertura (sin descargar datos en ejecución).
terrain.srtm-path=../matlab/data/srtm_fuenlabrada.tif
# Etiqueta de procedencia escrita en metadatos nuevos; independiente de la ruta.
# Si se omite, se informa "Raster local (procedencia no especificada)".
# Para un raster sintético u otra fuente, configurar terrain.source explícitamente.

# Swagger UI disponible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Compresión GZIP para respuestas JSON grandes (~200 KB → ~25 KB)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
