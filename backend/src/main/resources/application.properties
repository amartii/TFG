server.port=8080

# Directorio donde Spring Boot busca los JSON generados por MATLAB.
# Ruta relativa al directorio de trabajo del proceso Java (normalmente backend/).
# Cambiar a ruta absoluta si se ejecuta desde otro directorio.
simulations.data-dir=../matlab/output

# Swagger UI disponible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
