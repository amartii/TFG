services:
  seed:
    build:
      context: ./backend
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown 10001:10001 /data
        if [ ! -e /data/00000000-0000-4000-8000-000000000001.json ]; then
          cp /opt/demo/00000000-0000-4000-8000-000000000001.json /data/
          chown 10001:10001 /data/00000000-0000-4000-8000-000000000001.json
        fi
    volumes:
      - simulations:/data
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      SIMULATIONS_DATA_DIR: /data
      TERRAIN_SRTM_PATH: /opt/demo/terrain-synthetic.tif
      TERRAIN_SOURCE: Terreno sintético de demostración
    volumes:
      - simulations:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  simulations:
